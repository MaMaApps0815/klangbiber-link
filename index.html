  @font-face {

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--grund);
    color: var(--tinte);
    font-family: "Outfit", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  main {
    width: 100%;
    max-width: 26rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    text-align: center;
  }
  svg { display: block; }
  h1 {
    font-family: "Fraunces", Georgia, serif;

  .untertitel {

    font-size: 1rem;
    color: var(--gedaempft);
    line-height: 1.45;
    max-width: 22rem;
  }
  .kopf { display: flex; flex-direction: column; align-items: center; }

  .knoepfe { display: flex; flex-direction: column; gap: .85rem; width: 100%; }
  a.laden {
    display: flex;
    align-items: center;
    gap: .85rem;
    padding: .95rem 1.15rem;
    background: var(--karte);
    color: var(--tinte);
    border: 3px solid var(--tinte);
    border-radius: 14px;
    box-shadow: var(--schatten);
    text-decoration: none;
    text-align: left;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a.laden:hover, a.laden:focus-visible {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--tinte);
  }
  a.laden:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
  a.laden .zeichen {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border: 2px solid var(--tinte);
    border-radius: 10px;
    background: var(--grund);
  }
  a.laden .text { display: flex; flex-direction: column; line-height: 1.25; }
  a.laden .wo { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 1.08rem; }
  a.laden .fuer { font-size: .82rem; color: var(--gedaempft); }
  a.laden .pfeil { margin-left: auto; color: var(--gedaempft); font-size: 1.3rem; line-height: 1; }

  .status {
    font-size: .85rem;
    color: var(--gedaempft);
    min-height: 1.2em;
    margin: 0;
  }
  .status b { color: var(--teal); font-weight: 600; }
  footer {
    font-size: .78rem;
    color: var(--gedaempft);
    line-height: 1.5;
    border-top: 1px solid var(--rand);
    padding-top: 1rem;
    width: 100%;

  footer a { color: var(--gedaempft); }
  .rechtliches {

    margin-top: .6rem;
  }
  .rechtliches a { text-decoration: underline; text-underline-offset: 2px; }
  .rechtliches span { color: var(--rand); }
  @media (prefers-reduced-motion: reduce) {
    a.laden { transition: none; }
  }
</style>

<script>
(function () {
  var APPLE = "https://apps.apple.com/de/app/klangbiber/id6764178009";
  var PLAY  = "https://play.google.com/store/apps/details?id=de.klangbiber.app";

  // Mit ?bleib am Ende der Adresse bleibt die Seite stehen - praktisch zum Ansehen und Testen.
  if (location.search.indexOf("bleib") > -1) {
    document.getElementById("status").innerHTML = "Automatische Weiterleitung ist für diesen Aufruf ausgeschaltet.";
    return;
  }

  var ua = navigator.userAgent || "";
  // iPadOS ab 13 meldet sich als Macintosh; Touchpunkte verraten das echte Gerät.
  var istApple = /iPad|iPhone|iPod/.test(ua) ||
                 (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var istAndroid = /Android/.test(ua) && !/Windows Phone/.test(ua);

  var ziel = istApple ? APPLE : istAndroid ? PLAY : null;
  if (!ziel) return;   // Rechner und alles Unbekannte sehen beide Schaltflächen.

  document.getElementById("status").innerHTML =
    "Einen Moment, wir öffnen den <b>" + (istApple ? "App Store" : "Google Play Store") + "</b> …";

  // replace statt href: der Zurück-Knopf führt danach nicht in eine Schleife.
  location.replace(ziel);
})();
</script>
